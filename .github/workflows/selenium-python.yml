name: Python Selenium UI tests
on:
  push:
    paths:
      - 'python-selenium/**'
      - '.github/workflows/selenium-python.yml'
  pull_request:
    paths:
      - 'python-selenium/**'
      - '.github/workflows/selenium-python.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selenium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: browser-actions/setup-chrome@v1
      - name: Install dependencies
        run: python -m pip install -r python-selenium/requirements.txt
      - name: Run Selenium tests
        run: pytest -q python-selenium/tests
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-failure-screenshots
          path: python-selenium/artifacts/
          if-no-files-found: ignore

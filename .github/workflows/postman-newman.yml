name: Postman API contract checks
on:
  push:
    paths:
      - 'postman/**'
      - '.github/workflows/postman-newman.yml'
  pull_request:
    paths:
      - 'postman/**'
      - '.github/workflows/postman-newman.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  newman:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Newman
        run: npm install --global newman@6
      - name: Run API collection
        run: newman run postman/QA-API-Checks.postman_collection.json --reporters cli,junit --reporter-junit-export postman/newman-report.xml
      - name: Upload Newman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-api-report
          path: postman/newman-report.xml
          if-no-files-found: ignore
